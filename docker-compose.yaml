##
# docker-compose up [-d]
# docker-compose down
##
networks:
  inception-net:
  
services:
  parzu:
   build: .
   ports:
     - 5003:5003
   restart: unless-stopped
      
  inception-db:
    image: "mariadb:11.4"
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
      - MARIADB_DATABASE=inception
      - MARIADB_USER=${DBUSER:-inception}
      - MARIADB_PASSWORD=${DBPASSWORD:-inception}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${INCEPTION_DB_HOME:-INCEpTION-db-data}:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost", "-p${DBPASSWORD:-inception}", "-u${DBUSER:-inception}"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      inception-net:

  INCEpTION:
    image: "${INCEPTION_IMAGE:-ghcr.io/inception-project/inception}:${INCEPTION_VERSION:-latest}"
    ports:
      - "${INCEPTION_PORT:-8080}:8080"
    environment:
      - INCEPTION_DB_DIALECT=org.hibernate.dialect.MariaDB106Dialect
      - INCEPTION_DB_URL=jdbc:mariadb://inception-db:3306/inception?useSSL=false&useUnicode=true&characterEncoding=UTF-8
      - INCEPTION_DB_USERNAME=${DBUSER:-inception}
      - INCEPTION_DB_PASSWORD=${DBPASSWORD:-inception}
    volumes:
      - ./inception_docker:/export
    depends_on:
      inception-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      inception-net:
      
volumes:
  INCEpTION-db-data: